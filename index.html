<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YANLIŞ DEĞİL</title>
<style>
:root{--bg:#f2f5f9;--card:#fff;--ink:#14213d;--mut:#5b6b85;--line:#d5dce8;--ok:#1b8a5a;--okbg:#dff3e8;--bad:#c2412d;--badbg:#fbe4df;--hint:#2f5bd1;--hintbg:#e3eafc}
@media (prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#18223a;--ink:#e8edf7;--mut:#9aa8c2;--line:#2a3857;--ok:#4cc58c;--okbg:#14382a;--bad:#ff8a74;--badbg:#42201a;--hint:#8fb0ff;--hintbg:#1b2a52}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:600px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:30px;margin:0;font-weight:800}h1 s{text-decoration-thickness:4px;text-decoration-color:var(--bad);opacity:.75}
h2{font-size:16px;margin:18px 0 8px;color:var(--mut);font-weight:600}
.sub{color:var(--mut);margin:2px 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.opt,.btn,.top{font:inherit;color:inherit;cursor:pointer}
.chip{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:7px 14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:disabled{opacity:.45;cursor:default}
.top{display:flex;justify-content:space-between;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.top small{color:var(--bad)}
.q{font-size:19px;font-weight:500;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:9px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.no{background:var(--badbg);border-color:var(--bad);text-decoration:line-through;opacity:.8}
.opt:disabled,.btn:disabled{cursor:default}
.row{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.btn{font-weight:600;border-radius:10px;padding:11px 16px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg)}
.btn.g{background:transparent;color:var(--ink);border-color:var(--line)}
:focus-visible{outline:3px solid var(--hint);outline-offset:2px}
.fb{margin-top:14px;border-radius:10px;padding:13px 15px;font-size:15px}
.fb b{display:block;margin-bottom:4px}.fb p{margin:6px 0}
.fb.s{background:var(--badbg);border-left:5px solid var(--bad)}
.fb.l{background:var(--hintbg);border-left:5px solid var(--hint)}
.fb.g{background:var(--okbg);border-left:5px solid var(--ok)}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:10px}
.err{color:var(--bad)}
.note{font-size:12px;color:var(--mut);margin-top:14px}
</style>
</head>
<body>
<main id="app"></main>
<script>
var SB=["Fizik","Kimya","Biyoloji","Matematik","Türk Dili ve Edebiyatı","Tarih","Coğrafya"];
var T9={
"Fizik":["Fizik Bilimine Giriş","Madde ve Özellikleri","Hareket ve Kuvvet","Enerji","Isı ve Sıcaklık","Elektrostatik"],
"Kimya":["Kimya Bilimi","Atom ve Periyodik Sistem","Kimyasal Türler Arası Etkileşimler","Maddenin Hâlleri","Doğa ve Kimya"],
"Biyoloji":["Yaşam Bilimi Biyoloji","Hücre","Canlıların Çeşitliliği ve Sınıflandırılması","Ekosistem Ekolojisi"],
"Matematik":["Mantık","Kümeler","Denklemler ve Eşitsizlikler","Üçgenler","Veri"],
"Türk Dili ve Edebiyatı":["Hikâye","Şiir","Masal ve Fabl","Roman","Tiyatro"],
"Tarih":["Tarih ve Zaman","İnsanlığın İlk Dönemleri","Orta Çağ'da Dünya","İlk ve Orta Çağlarda Türk Dünyası","İslam Medeniyetinin Doğuşu"],
"Coğrafya":["Harita Bilgisi","Doğal Sistemler","İklim","Yer Şekilleri","Nüfus"]};
var TOPICS={9:T9}; // 10, 11, 12. sınıf konuları buraya aynı biçimde eklenecek
var app=document.getElementById("app");
var S={g:9,s:"Fizik",tp:null,q:null,tries:0,hints:0,sel:[],fb:"",locked:false,busy:false,score:0,n:0,asked:[],err:""};
var W={};try{W=JSON.parse(localStorage.getItem("yd_weak")||"{}")}catch(e){}
function saveW(){try{localStorage.setItem("yd_weak",JSON.stringify(W))}catch(e){}}
function esc(x){return String(x).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function paras(t){return String(t).split(/\n+/).map(function(p){return"<p>"+esc(p)+"</p>"}).join("")}
function head(){return'<h1><s>YANLIŞ</s> DEĞİL</h1><p class="sub">Yanlışını yakalar, nedenini anlatır.</p>'}
function wkey(t){return S.g+"|"+S.s+"|"+t}
function menu(){
S.tp=null;S.nextQ=null;S.nextP=null;
var h=head()+'<h2>Sınıf</h2><div class="chips">';
[9,10,11,12].forEach(function(g){h+='<button class="chip'+(S.g==g?" on":"")+'" data-g="'+g+'">'+g+'. sınıf</button>'});
h+='</div><h2>Ders</h2><div class="chips">';
SB.forEach(function(s){h+='<button class="chip'+(S.s==s?" on":"")+'" data-s="'+esc(s)+'">'+esc(s)+'</button>'});
h+='</div><h2>Konu</h2>';
var list=TOPICS[S.g]&&TOPICS[S.g][S.s];
if(!list){h+='<div class="card">'+S.g+'. sınıf içerikleri çok yakında. Şimdilik 9. sınıfı dene.</div>'}
else{
h+='<button class="top" data-t="Karışık"><span>Karışık (tüm konular)</span></button>';
list.forEach(function(t){var w=W[wkey(t)];h+='<button class="top" data-t="'+esc(t)+'"><span>'+esc(t)+'</span>'+(w?'<small>'+w+' takılma</small>':'')+'</button>'})}
app.innerHTML=h;
app.querySelectorAll("[data-g]").forEach(function(b){b.onclick=function(){S.g=+b.dataset.g;menu()}});
app.querySelectorAll("[data-s]").forEach(function(b){b.onclick=function(){S.s=b.dataset.s;menu()}});
app.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){S.tp=b.dataset.t;S.asked=[];S.score=0;S.n=0;nextQ()}});
}
function api(body){
body.grade=S.g;body.subject=S.s;body.topic=S.tp;
return fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
.then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Hata");return j})});
}
function show(q){S.q=q;S.asked.push(q.soru);S.n++;S.busy=false;draw();prefetch()}
function fail(e){S.busy=false;S.err=e.message;draw()}
function prefetch(){
if(S.nextQ||S.nextP)return;
var p=api({mode:"q",asked:S.asked}).then(function(q){if(S.nextP===p){S.nextP=null;S.nextQ=q}}).catch(function(){if(S.nextP===p)S.nextP=null});
S.nextP=p;
}
function fresh(){api({mode:"q",asked:S.asked}).then(show).catch(fail)}
function nextQ(){
S.q=null;S.tries=0;S.hints=0;S.sel=[];S.fb="";S.locked=false;S.err="";
if(S.nextQ){var q=S.nextQ;S.nextQ=null;show(q);return}
S.busy=true;draw();
if(S.nextP){S.nextP.then(function(){if(S.nextQ){var q=S.nextQ;S.nextQ=null;show(q)}else fresh()});return}
fresh();
}
function draw(){
var h=head()+'<div class="meta"><span>'+esc(S.s)+' · '+esc(S.tp)+'</span><span>İlk denemede: '+S.score+' / '+Math.max(S.n-(S.locked?0:1),0)+'</span></div><div class="card">';
if(S.err){h+='<p class="err">'+esc(S.err)+'</p><div class="row"><button class="btn" id="retry">Tekrar dene</button><button class="btn g" id="back">Konu menüsü</button></div></div>';app.innerHTML=h;
document.getElementById("retry").onclick=nextQ;document.getElementById("back").onclick=menu;return}
if(!S.q){app.innerHTML=h+'<p>Soru hazırlanıyor...</p></div>';return}
h+='<p class="q">'+esc(S.q.soru)+'</p>';
S.q.secenekler.forEach(function(t,k){
var c="",d=S.busy||S.locked?" disabled":"";
if(S.sel.indexOf(k)>-1){c=" no";d=" disabled"}
if(S.locked&&k==S.q.dogru)c=" ok";
h+='<button class="opt'+c+'"'+d+' data-k="'+k+'">'+String.fromCharCode(65+k)+") "+esc(t)+'</button>'});
if(!S.locked)h+='<div class="row"><button class="btn g" id="hint"'+(S.busy?" disabled":"")+'>? Anlamadım</button></div>';
h+=S.busy&&S.q?'<div class="fb s"><b>Düşünüyorum...</b></div>':S.fb;
if(S.locked)h+='<div class="row"><button class="btn" id="next">Sıradaki soru</button><button class="btn g" id="back">Konu menüsü</button></div>';
h+='</div>';
app.innerHTML=h;
app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){pick(+b.dataset.k)}});
var e=document.getElementById("hint");if(e)e.onclick=hint;
e=document.getElementById("next");if(e)e.onclick=nextQ;
e=document.getElementById("back");if(e)e.onclick=menu;
}
function weak(){var k=wkey(S.tp==="Karışık"?"Karışık":S.tp);W[k]=(W[k]||0)+1;saveW()}
function explain(attempt){
S.busy=true;draw();
api({mode:"explain",question:S.q,chosen:S.sel,attempt:attempt}).then(function(r){
S.busy=false;
if(attempt==1)S.fb='<div class="fb s"><b>Nokta atışı</b>'+paras(r.aciklama)+'<p>Tekrar dene.</p></div>';
else{S.locked=true;S.fb='<div class="fb l"><b>Konuyu baştan açalım</b>'+paras(r.aciklama)+'</div>'}
draw()}).catch(function(e){S.busy=false;S.fb='<div class="fb s">Açıklama alınamadı: '+esc(e.message)+'</div>';draw()});
}
function pick(k){
if(S.busy||S.locked)return;
if(k==S.q.dogru){
if(!S.tries&&!S.hints)S.score++;
S.locked=true;S.fb='<div class="fb g"><b>Doğru!</b>'+(S.tries||S.hints?'Bu konuyu zayıf konulara ekledim.':'İlk denemede buldun.')+'</div>';draw();return}
S.tries++;S.sel.push(k);weak();
explain(S.tries==1&&!S.hints?1:2);
}
function hint(){
if(S.busy||S.locked)return;
S.hints++;weak();
explain(S.hints==1&&!S.tries?1:2);
}
menu();
</script>
</body>
</html>
